<!-- PROTOTYPE: throwaway design exploration for issue #140. Question: what should the rebuilt dashboard look and feel like? Three variants switchable via ?variant=a|b|c. -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speculators | Find the fastest drafter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --radius-shell: 1.25rem;
  --radius-base: 0.625rem;
  --max-w: 72rem;
  --yellow: #fdb517;
  --yellow-hover: #e5a315;
  --red: #ef4444;
  --green: #22c55e;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #020617;
  --surface: #0f172a;
  --muted-surface: #1e293b;
  --text-1: #f8fafc;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --border: rgba(255,255,255,0.1);
  --border-input: rgba(255,255,255,0.15);
  --border-soft: rgba(255,255,255,0.05);
  --row-hover: rgba(255,255,255,0.025);
  --row-active: rgba(48,162,255,0.045);
  --inset-bg: rgba(2,6,23,0.45);
  --shell-bg: rgba(15,23,42,0.55);
  --eyebrow-bg: rgba(2,6,23,0.4);
  --blue: #30a2ff;
  --aur-deep: rgba(6,21,46,0.95);
  --aur-blue: rgba(11,79,143,0.55);
  --aur-bright: rgba(48,162,255,0.28);
  --aur-gold: rgba(253,181,23,0.10);
  --algo-eagle3-text: #60a5fa;
  --algo-dflash-text: #fb923c;
  --algo-peagle-text: #c084fc;
  --algo-mtp-text: #34d399;
  --dia-node-fill: rgba(15,23,42,0.85);
  --drop-shadow: 0 16px 40px rgba(2,6,23,0.5);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f8fb;
  --surface: #ffffff;
  --muted-surface: #e8edf4;
  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #8a9ab0;
  --border: rgba(15,23,42,0.12);
  --border-input: rgba(15,23,42,0.2);
  --border-soft: rgba(15,23,42,0.07);
  --row-hover: rgba(15,23,42,0.03);
  --row-active: rgba(2,132,199,0.06);
  --inset-bg: rgba(241,245,249,0.85);
  --shell-bg: rgba(255,255,255,0.8);
  --eyebrow-bg: rgba(255,255,255,0.65);
  --blue: #0284c7;
  --aur-deep: rgba(186,215,245,0.55);
  --aur-blue: rgba(125,180,235,0.4);
  --aur-bright: rgba(48,162,255,0.16);
  --aur-gold: rgba(253,181,23,0.14);
  --algo-eagle3-text: #2563eb;
  --algo-dflash-text: #ea580c;
  --algo-peagle-text: #9333ea;
  --algo-mtp-text: #059669;
  --dia-node-fill: rgba(255,255,255,0.92);
  --drop-shadow: 0 16px 40px rgba(15,23,42,0.16);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text-1);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}
::selection { background: rgba(48,162,255,0.35); }
a { color: var(--blue); text-decoration: none; }
button { font-family: var(--sans); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

.fade-in-up {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.fade-in-up.visible { opacity: 1; transform: translateY(0); }

.container { max-width: var(--max-w); margin: 0 auto; padding: 0 2rem; }

.site-nav {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 80rem;
  margin: 0 auto;
  padding: 1.5rem 2rem;
}
.site-nav.static {
  position: relative;
  border-bottom: 1px solid var(--border);
  max-width: none;
}
.site-nav.static .nav-inner {
  max-width: 80rem; margin: 0 auto; width: 100%;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  color: var(--text-1);
  font-weight: 700;
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
}
.nav-brand:hover { text-decoration: none; }
.nav-brand svg { height: 1.75rem; width: auto; display: block; }
.nav-brand .nav-sub { font-weight: 400; color: var(--text-2); }
.nav-links { display: flex; align-items: center; gap: 1.75rem; }
.nav-links a, .nav-links .nav-link-btn {
  color: var(--text-2);
  font-size: 0.875rem;
  font-weight: 500;
  transition: color 250ms ease;
  background: none; border: 0; cursor: pointer; padding: 0;
}
.nav-links a:hover, .nav-links .nav-link-btn:hover { color: var(--text-1); text-decoration: none; }
.nav-links .nav-link-btn.active { color: var(--blue); }
.theme-toggle {
  font-family: var(--mono);
  font-size: 0.6875rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--border-input);
  border-radius: 999px;
  color: var(--text-2);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 250ms ease, border-color 250ms ease;
}
.theme-toggle:hover { color: var(--text-1); border-color: var(--text-3); }

.hero {
  position: relative;
  overflow: hidden;
  min-height: 88vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9rem 2rem 7rem;
  background: var(--bg);
}
.hero.compact { min-height: auto; padding: 9rem 2rem 4.5rem; }

.aurora { position: absolute; inset: -10%; pointer-events: none; }
.aurora-blob { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
.aurora-blob--deep {
  top: -20%; left: -10%; width: 65vw; height: 65vw;
  background: radial-gradient(circle, var(--aur-deep) 0%, transparent 65%);
  animation: drift-a 28s ease-in-out infinite;
}
.aurora-blob--blue {
  top: 5%; right: -15%; width: 55vw; height: 55vw;
  background: radial-gradient(circle, var(--aur-blue) 0%, transparent 62%);
  animation: drift-b 24s ease-in-out infinite;
}
.aurora-blob--bright {
  bottom: -25%; left: 20%; width: 50vw; height: 50vw;
  background: radial-gradient(circle, var(--aur-bright) 0%, transparent 60%);
  animation: drift-c 30s ease-in-out infinite;
}
.aurora-blob--gold {
  top: 35%; left: 55%; width: 30vw; height: 30vw;
  background: radial-gradient(circle, var(--aur-gold) 0%, transparent 60%);
  animation: drift-b 26s ease-in-out infinite reverse;
}
.aurora::after {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 26px 26px;
}
.hero::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 30%;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}

@keyframes drift-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(7%, -6%) scale(1.12); }
  66%      { transform: translate(-5%, 5%) scale(0.96); }
}
@keyframes drift-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-8%, 7%) scale(1.1); }
}
@keyframes drift-c {
  0%, 100% { transform: translate(0, 0) scale(1); }
  40%      { transform: translate(6%, -9%) scale(1.08); }
  75%      { transform: translate(-6%, -3%) scale(0.94); }
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: 60rem;
  width: 100%;
  text-align: center;
  animation: hero-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes hero-in {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.375rem 1rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 2.25rem;
  background: var(--eyebrow-bg);
}
.hero-eyebrow .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 10px rgba(48,162,255,0.9);
}
.hero-title {
  font-size: clamp(3.5rem, 7.5vw, 5.5rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.04;
  color: var(--text-1);
  margin-bottom: 1.75rem;
}
.hero-title .grad {
  background: linear-gradient(94deg, #30a2ff 5%, #7cc7ff 42%, #fdb517 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-subtitle {
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--text-2);
  max-width: 38rem;
  margin: 0 auto 2.75rem;
  line-height: 1.65;
}
.hero-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.875rem 2rem;
  border-radius: 999px;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 250ms ease;
  text-decoration: none;
}
.btn-primary { background: var(--yellow); color: #020617; }
.btn-primary:hover { background: var(--yellow-hover); transform: translateY(-2px); text-decoration: none; }
.btn-ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border-input); }
.btn-ghost:hover { border-color: var(--text-3); background: var(--row-hover); transform: translateY(-2px); text-decoration: none; }
.hero-meta { font-size: 0.8125rem; color: var(--text-3); font-family: var(--mono); }

.how-section { padding: 2rem 0 0; }
.how-shell {
  background: var(--shell-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-shell);
  padding: 2.75rem 2.5rem 2rem;
}
.how-header { text-align: center; max-width: 44rem; margin: 0 auto 2.25rem; }
.how-eyebrow {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 0.875rem;
}
.how-title {
  font-size: 1.875rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-1);
  margin-bottom: 0.875rem;
}
.how-caption { font-size: 1rem; color: var(--text-2); line-height: 1.65; }

.spec-diagram { width: 100%; height: auto; display: block; }
.spec-diagram text { font-family: var(--mono); text-transform: uppercase; }
.dia-label { fill: var(--text-2); font-size: 9.5px; letter-spacing: 0.14em; }
.dia-sub   { fill: var(--text-3); font-size: 8px; letter-spacing: 0.12em; }
.dia-anno  { fill: var(--text-3); font-size: 8px; letter-spacing: 0.16em; }
.dia-node  { fill: var(--dia-node-fill); stroke: rgba(48,162,255,0.55); stroke-width: 1; }
.dia-node--target { stroke: var(--blue); stroke-width: 1.25; }
.dia-edge  { stroke: rgba(48,162,255,0.35); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
.dia-edge--accept { stroke: rgba(34,197,94,0.45); }
.dia-leader { stroke: rgba(148,163,184,0.3); stroke-width: 1; stroke-dasharray: 2 3; }
.dia-pulse {
  fill: none; stroke: var(--blue); stroke-width: 1.5; opacity: 0;
  transform-origin: 496px 96px;
  animation: verify-pulse 6s ease-out infinite;
}
@keyframes verify-pulse {
  0%, 38%   { opacity: 0; transform: scale(1); }
  44%       { opacity: 0.7; transform: scale(1); }
  62%, 100% { opacity: 0; transform: scale(1.35); }
}
.chip rect { rx: 3; stroke-width: 1; fill: rgba(48,162,255,0.14); stroke: var(--blue); }
.chip text { fill: var(--blue); font-size: 9px; font-weight: 700; }
.chip { animation: chip-fly 6s linear infinite; opacity: 0; }
.chip rect { animation: chip-ok-rect 6s linear infinite; }
.chip text { animation: chip-ok-text 6s linear infinite; }
.chip-2 rect, .chip-2 text, .chip-2 { animation-delay: 0.12s; }
.chip-3 rect, .chip-3 text, .chip-3 { animation-delay: 0.24s; }
.chip-4 rect, .chip-4 text, .chip-4 { animation-delay: 0.36s; }
@keyframes chip-fly {
  0%        { transform: translate(0, 0);     opacity: 0; }
  6%        { opacity: 1; }
  52%       { transform: translate(236px, 0); opacity: 1; }
  56%, 100% { transform: translate(236px, 0); opacity: 1; }
}
.chip-1 rect, .chip-2 rect { animation-name: chip-ok-rect; }
.chip-1 text, .chip-2 text { animation-name: chip-ok-text; }
.chip-1, .chip-2 { animation-name: chip-fly; }
.chip-3, .chip-4 { animation-name: chip-fly-reject; }
@keyframes chip-ok-rect {
  0%, 51%   { fill: rgba(48,162,255,0.14); stroke: var(--blue); }
  56%, 100% { fill: rgba(34,197,94,0.16); stroke: var(--green); }
}
@keyframes chip-ok-text {
  0%, 51%   { fill: var(--blue); }
  56%, 100% { fill: var(--green); }
}
@keyframes chip-fly-reject {
  0%        { transform: translate(0, 0);        opacity: 0; }
  6%        { opacity: 1; }
  52%       { transform: translate(236px, 0);    opacity: 1; }
  56%       { transform: translate(236px, 0);    opacity: 1; }
  74%       { transform: translate(236px, 26px); opacity: 0.85; }
  88%, 100% { transform: translate(236px, 26px); opacity: 0; }
}
.chip-3 rect, .chip-4 rect { animation-name: chip-rej-rect; }
.chip-3 text, .chip-4 text { animation-name: chip-rej-text; }
@keyframes chip-rej-rect {
  0%, 51%   { fill: rgba(48,162,255,0.14); stroke: var(--blue); }
  56%, 100% { fill: rgba(239,68,68,0.12); stroke: var(--red); }
}
@keyframes chip-rej-text {
  0%, 51%   { fill: var(--blue); }
  56%, 100% { fill: var(--red); }
}
.out-token rect { fill: rgba(34,197,94,0.14); stroke: var(--green); rx: 3; }
.out-token text { fill: var(--green); font-size: 9px; font-weight: 700; }
.out-token { animation: out-token 6s linear infinite; opacity: 0; }
.out-token-2 { animation-delay: 0.18s; }
@keyframes out-token {
  0%, 54%   { transform: translate(0, 0);    opacity: 0; }
  60%       { opacity: 1; }
  86%       { transform: translate(56px, 0); opacity: 1; }
  94%, 100% { transform: translate(56px, 0); opacity: 0; }
}
.dia-loop-dot { fill: var(--blue); opacity: 0; animation: loop-dot 6s ease-in-out infinite; }
@keyframes loop-dot {
  0%, 62%   { opacity: 0; transform: translateX(0); }
  68%       { opacity: 0.9; }
  88%       { opacity: 0.9; transform: translateX(-212px); }
  94%, 100% { opacity: 0; transform: translateX(-212px); }
}

.stats-section { padding: 5.5rem 0 4.5rem; }
.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); }
.stat { padding: 0 3rem; }
.stat:first-child { padding-left: 0; }
.stat + .stat { border-left: 1px solid var(--border); }
.stat-val {
  font-family: var(--mono);
  font-size: 3.5rem;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--text-1);
  font-variant-numeric: tabular-nums;
}
.stat-label {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-top: 0.875rem;
}
.stat-sublabel {
  font-family: var(--mono);
  font-size: 0.75rem;
  color: var(--text-3);
  margin-top: 0.375rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.section-head { margin-bottom: 2.5rem; }
.section-eyebrow {
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 0.875rem;
}
.section-title {
  font-size: clamp(2rem, 4vw, 2.875rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--text-1);
}
.section-desc { font-size: 1rem; color: var(--text-2); margin-top: 0.875rem; max-width: 40rem; }

.dash-section { padding: 4rem 0 5rem; }

.filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.filter-input {
  background: var(--surface);
  border: 1px solid var(--border-input);
  border-radius: var(--radius-base);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 0.875rem;
  padding: 0.625rem 1rem;
  outline: none;
  transition: border-color 250ms ease, box-shadow 250ms ease;
  width: 100%;
}
.filter-input::placeholder { color: var(--text-3); }
.filter-input:hover { border-color: var(--text-3); }
.filter-input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(48,162,255,0.15); }

.search { position: relative; flex: 1; min-width: 220px; }
.search-drop {
  position: absolute;
  top: calc(100% + 0.375rem);
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-base);
  box-shadow: var(--drop-shadow);
  z-index: 40;
  max-height: 18rem;
  overflow: auto;
  padding: 0.25rem;
}
.search-item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.125rem;
  width: 100%;
  text-align: left;
  padding: 0.5rem 0.625rem;
  border: 0;
  border-radius: 0.375rem;
  background: none;
  cursor: pointer;
}
.search-item:hover { background: var(--row-hover); }
.si-name { font-family: var(--mono); font-size: 0.75rem; color: var(--text-1); }
.si-meta { font-size: 0.6875rem; color: var(--text-3); }
.search-empty { padding: 0.625rem; font-size: 0.75rem; color: var(--text-3); }

.table-shell {
  border: 1px solid var(--border);
  border-radius: var(--radius-shell);
  background: var(--surface);
  overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th {
  text-align: left;
  padding: 1rem 1.25rem;
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-3);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  user-select: none;
}
th.right, td.right { text-align: right; }
tbody tr { transition: background 250ms ease; }
tbody tr.model-row { cursor: pointer; }
tbody tr.model-row:hover { background: var(--row-hover); }
tbody tr.model-row.expanded { background: var(--row-active); }
td { padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
.model-name { display: flex; flex-direction: column; gap: 0.25rem; }
.model-name .top-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.model-name .d-name { font-weight: 600; font-size: 0.9375rem; color: var(--text-1); font-family: var(--mono); }
.model-target { font-size: 0.75rem; color: var(--text-3); }

.algo-badge {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 999px;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.algo-eagle3 { background: rgba(59,130,246,0.15);  color: var(--algo-eagle3-text); }
.algo-dflash { background: rgba(249,115,22,0.15);  color: var(--algo-dflash-text); }
.algo-peagle { background: rgba(168,85,247,0.15);  color: var(--algo-peagle-text); }
.algo-mtp    { background: rgba(16,185,129,0.15);  color: var(--algo-mtp-text); }
.algo-other  { background: rgba(148,163,184,0.15); color: var(--text-2); }

.hw-chip {
  display: inline-block;
  padding: 0.1875rem 0.5rem;
  border-radius: 6px;
  background: var(--muted-surface);
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
}
.metric-val {
  font-family: var(--mono);
  font-weight: 500;
  font-size: 0.9375rem;
  font-variant-numeric: tabular-nums;
}
.metric-unit { font-size: 0.6875rem; color: var(--text-3); margin-left: 3px; }

.picked { display: flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; margin: 2rem 0 0.25rem; }

  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--text-3);
  font-size: 0.8125rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: color 250ms ease, border-color 250ms ease;
}
.detail-tab:hover { color: var(--text-1); }
.detail-tab.active { color: var(--blue); border-bottom-color: var(--blue); }

.chart-shell {
  border: 1px solid var(--border);
  border-radius: var(--radius-shell);
  background: var(--surface);
  padding: 1.75rem 1.5rem 1.25rem;
}
.bars { display: flex; align-items: flex-end; gap: 1.5rem; }
.bar-col { flex: 1; max-width: 12rem; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; min-width: 0; }
.bar-val { font-family: var(--mono); font-size: 0.8125rem; color: var(--text-1); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar-track { width: 100%; height: 180px; display: flex; align-items: flex-end; }
.bar-fill { width: 100%; min-height: 3px; background: var(--blue); border-radius: 4px 4px 0 0; }
.bar-label { font-family: var(--mono); font-size: 0.6875rem; color: var(--text-3); white-space: nowrap; }

.runs { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 1.5rem; }
.run-row { display: flex; flex-wrap: wrap; gap: 0.375rem; align-items: center; }

.sb { margin-top: 2.5rem; }
.sb .section-eyebrow { margin-bottom: 1rem; }
.subset-tbl { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
.subset-tbl th {

.subset-tbl td.num { text-align: right; font-family: var(--mono); font-weight: 500; font-variant-numeric: tabular-nums; }
.subset-tbl .unit { font-size: 0.625rem; color: var(--text-3); margin-left: 2px; }

.site-footer a:hover { color: var(--blue); text-decoration: none; }

  font-size: 0.75rem;
  background: var(--muted-surface);
  padding: 0.125rem 0.375rem;
  border-radius: 4px;

@keyframes flash {

  100% { outline: 2px solid transparent; outline-offset: 2px; }

.flash { animation: flash 1.2s ease-out; border-radius: 4px; }

.switcher {

  bottom: 1.25rem;

  align-items: center;
  gap: 0.25rem;

      <g class="chip chip-1 chip-static"><rect x="182" y="82" width="28" height="28" /><text x="196" y="99" text-anchor="middle">t₁</text></g>
      <g class="chip chip-2 chip-static"><rect x="214" y="82" width="28" height="28" /><text x="228" y="99" text-anchor="middle">t₂</text></g>
      <g class="chip chip-3 chip-static"><rect x="246" y="82" width="28" height="28" /><text x="260" y="99" text-anchor="middle">t₃</text></g>
      <g class="chip chip-4 chip-static"><rect x="278" y="82" width="28" height="28" /><text x="292" y="99" text-anchor="middle">t₄</text></g>
      <g class="out-token out-token-1"><rect x="566" y="82" width="28" height="28" /><text x="580" y="99" text-anchor="middle">t₁</text></g>
      <g class="out-token out-token-2"><rect x="566" y="82" width="28" height="28" /><text x="580" y="99" text-anchor="middle">t₂</text></g>
      <circle class="dia-loop-dot" cx="496" cy="172" r="3" />
      <path class="dia-leader" d="M 260 74 V 40 H 244" />
      <text class="dia-anno" x="238" y="44" text-anchor="end">γ draft tokens</text>
      <path class="dia-leader" d="M 496 22 V 46" />
      <text class="dia-anno" x="496" y="14" text-anchor="middle">1 forward pass</text>
      <path class="dia-leader" d="M 322 176 H 392 V 150" />
      <text class="dia-anno" x="314" y="180" text-anchor="end">re-draft</text>
    </svg>` +
    '</div></div></section>';
}

function statsHTML() {
  let best = null, bestD = null;
  DATA.forEach(function (d) {
    const v = d.runs[0].throughput;
    if (best === null || v > best) { best = v; bestD = d; }
  });
  const algos = {};
  DATA.forEach(function (d) { algos[d.algorithm] = true; });
  return '<section class="stats-section fade-in-up"><div class="container"><div class="stats-row">' +
    '<div class="stat"><div class="stat-val">' + DATA.length + '</div><div class="stat-label">Models Evaluated</div></div>' +
    '<div class="stat"><div class="stat-val">' + Math.round(best).toLocaleString('en-US') + '</div><div class="stat-label">Best Throughput (tok/s)</div><div class="stat-sublabel">' + short(bestD.name) + '</div></div>' +
    '<div class="stat"><div class="stat-val">' + Object.keys(algos).length + '</div><div class="stat-label">Algorithms Compared</div></div>' +
    '</div></div></section>';
}

function footerHTML() {
  return '<footer class="site-footer">' +
    '<span>Data source: <code>results.json</code> &middot; &copy; 2025 Red Hat AI</span>' +
    '<span>Powered by <a href="https://github.com/vllm-project/speculators" target="_blank" rel="noopener">vllm-project/speculators</a></span>' +
    '</footer>';
}

function searchHTML() {
  return '<div class="search" data-search>' +
    '<input type="text" class="filter-input" placeholder="Search drafters" aria-label="Search drafters" autocomplete="off" spellcheck="false">' +
    '<div class="search-drop" hidden></div></div>';
}

function metricTabsHTML() {
  return '<div class="detail-tabs">' + Object.keys(METRICS).map(function (k) {
    return '<button type="button" class="detail-tab' + (state.metric === k ? ' active' : '') + '" data-metric="' + k + '">' + METRICS[k].label + '</button>';
  }).join('') + '</div>';
}

function barsHTML(d) {
  const m = METRICS[state.metric];
  const max = Math.max.apply(null, d.runs.map(function (r) { return m.raw(r); }));
  const cols = d.runs.map(function (r) {
    const v = m.raw(r);
    const h = Math.max(3, Math.round((v / max) * 100));
    return '<div class="bar-col">' +
      '<div class="bar-val">' + m.fmt(v) + '</div>' +
      '<div class="bar-track"><div class="bar-fill" style="height:' + h + '%"></div></div>' +
      '<div class="bar-label">' + r.date.slice(5) + ' · ' + r.hardware + '</div></div>';
  }).join('');
  return '<div class="bars">' + cols + '</div>';
}

function runsHTML(d) {
  return '<div class="runs">' + d.runs.map(function (r) {
    return '<div class="run-row">' +
      '<span class="hw-chip">' + r.date + '</span>' +
      '<span class="hw-chip">' + r.hardware + '</span>' +
      '<span class="hw-chip">vLLM ' + r.vllm + '</span>' +
      '<span class="hw-chip">speculators ' + r.speculators + '</span></div>';
  }).join('') + '</div>';
}

function sbHTML(d) {
  if (!d.speedBench || d.speedBench.length === 0) return '';
  const rows = d.speedBench.map(function (s) {
    return '<tr><td class="subset-name">' + s.subset + '</td>' +
      '<td class="num">' + s.score.toFixed(1) + '</td>' +
      '<td class="num">' + Math.round(s.tokensPerSec).toLocaleString('en-US') + '<span class="unit">tok/s</span></td></tr>';
  }).join('');
  return '<div class="sb"><div class="section-eyebrow">SPEED-Bench</div>' +
    '<div class="table-shell"><table class="subset-tbl">' +
    '<thead><tr><th>Subset</th><th class="num">Score</th><th class="num">Tokens/s</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></div>';
}

function pickedHTML(d) {
  return '<div class="picked" data-anchor="' + d.id + '">' +
    '<span class="picked-name">' + short(d.name) + '</span>' +
    '<span class="algo-badge ' + algoClass(d.algorithm) + '">' + d.algorithm + '</span>' +
    '<span class="picked-target">Target: ' + d.target + '</span></div>';
}

function leaderboardHTML() {
  const rows = DATA.map(function (d) {
    const r = d.runs[0];
    return '<tr class="model-row' + (state.selected === d.id ? ' expanded' : '') + '" data-anchor="' + d.id + '" data-select="' + d.id + '">' +
      '<td><div class="model-name"><span class="top-row"><span class="d-name">' + short(d.name) + '</span>' +
      '<span class="algo-badge ' + algoClass(d.algorithm) + '">' + d.algorithm + '</span></span>' +
      '<span class="model-target">' + short(d.target) + '</span></div></td>' +
      '<td class="right"><span class="metric-val">' + METRICS.acceptance.fmt(r.acceptance) + '</span></td>' +
      '<td class="right"><span class="metric-val">' + METRICS.throughput.fmt(r.throughput) + '</span><span class="metric-unit">tok/s</span></td>' +
      '<td class="right"><span class="metric-val">' + METRICS.latency.fmt(r.latency) + '</span><span class="metric-unit">ms/tok</span></td>' +
      '<td><span class="hw-chip">' + r.hardware + '</span></td></tr>';
  }).join('');
  return '<div class="table-shell"><div class="table-scroll"><table>' +
    '<thead><tr><th>Drafter</th><th class="right">Acceptance</th><th class="right">Throughput</th><th class="right">Latency</th><th>Hardware</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div></div>';
}

function dashHTML(opts) {
  const d = selectedDrafter();
  let html = '<div class="section-head">' +
    '<div class="section-eyebrow">Benchmarks</div>' +
    '<h2 class="section-title">The results.</h2>' +
    '<p class="section-desc">Search for a drafter to inspect its eval runs, or pick one from the list.</p></div>' +
    '<div class="filters">' + searchHTML() + '</div>';
  if (opts.leaderboard) html += leaderboardHTML();
  html += pickedHTML(d) + metricTabsHTML() +
    '<div class="chart-shell">' + barsHTML(d) + '</div>' +
    runsHTML(d) + sbHTML(d);
  return html;
}

function viewA() {
  return heroHTML(false, {}) +
    '<main>' +
    howHTML() +
    statsHTML() +
    '<section class="dash-section fade-in-up"><div class="container">' + dashHTML({}) + '</div></section>' +
    '</main>' + footerHTML();
}

function viewB() {
  return heroHTML(true, {}) +
    '<main>' +
    '<section class="dash-section fade-in-up" style="padding-top:2rem"><div class="container">' + dashHTML({ leaderboard: true }) + '</div></section>' +
    howHTML() +
    '</main>' + footerHTML();
}

function viewC() {
  if (state.cView === 'dashboard') {
    return navHTML({ slim: true, viewToggle: 'overview' }) +
      '<main><section class="dash-section"><div class="container">' + dashHTML({}) + '</div></section></main>' +
      footerHTML();
  }
  return heroHTML(false, { viewToggle: 'dashboard' }) +
    '<main>' + howHTML() + statsHTML() + '</main>' + footerHTML();
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  const app = document.getElementById('app');
  app.innerHTML = state.variant === 'a' ? viewA() : state.variant === 'b' ? viewB() : viewC();
  document.getElementById('sw-label').textContent = VARIANT_LABELS[state.variant];
  bind(app);
  setupAnimations();
}

function bind(app) {
  app.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      render();
    });
  });
  app.querySelectorAll('[data-metric]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.metric = b.dataset.metric;
      render();
    });
  });
  app.querySelectorAll('[data-select]').forEach(function (el) {
    el.addEventListener('click', function () {
      state.selected = el.dataset.select;
      render();
    });
  });
  app.querySelectorAll('[data-view]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.cView = b.dataset.view;
      render();
      window.scrollTo(0, 0);
    });
  });
  app.querySelectorAll('[data-search]').forEach(function (wrap) {
    const input = wrap.querySelector('input');
    const drop = wrap.querySelector('.search-drop');
    input.value = state.query;
    input.addEventListener('input', function () {
      state.query = input.value;
      const q = input.value.trim().toLowerCase();
      if (!q) { drop.hidden = true; drop.innerHTML = ''; return; }
      const matches = DATA.filter(function (d) { return d.name.toLowerCase().indexOf(q) >= 0; });
      drop.innerHTML = matches.length
        ? matches.map(function (d) {
            return '<button type="button" class="search-item" data-pick="' + d.id + '">' +
              '<span class="si-name">' + short(d.name) + '</span>' +
              '<span class="si-meta">' + short(d.target) + ' · ' + d.algorithm + '</span></button>';
          }).join('')
        : '<div class="search-empty">No matching drafters</div>';
      drop.hidden = false;
    });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { drop.hidden = true; input.blur(); }
    });
    drop.addEventListener('click', function (e) {
      const item = e.target.closest('[data-pick]');
      if (item) { drop.hidden = true; selectDrafter(item.dataset.pick, true); }
    });
  });
}

function selectDrafter(id, scroll) {
  const d = DATA.find(function (x) { return x.id === id; });
  if (!d) return;
  state.selected = id;
  state.query = short(d.name);
  render();
  if (scroll) {
    requestAnimationFrame(function () {
      const el = document.querySelector('[data-anchor="' + id + '"]');
      if (el) {
        el.scrollIntoView({ block: 'center', behavior: 'smooth' });
        el.classList.add('flash');
        setTimeout(function () { el.classList.remove('flash'); }, 1200);
      }
    });
  }
}

function setupAnimations() {
  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.fade-in-up').forEach(function (el) { observer.observe(el); });
}

function setVariant(v) {
  state.variant = v;
  state.cView = 'landing';
  history.replaceState(null, '', '?variant=' + v);
  render();
  window.scrollTo(0, 0);
}

function cycle(dir) {
  const i = VARIANTS.indexOf(state.variant);
  const next = (i + dir + VARIANTS.length) % VARIANTS.length;
  setVariant(VARIANTS[next]);
}

function closeAllDrops() {
  document.querySelectorAll('.search-drop').forEach(function (d) { d.hidden = true; });
}

document.getElementById('sw-prev').addEventListener('click', function () { cycle(-1); });
document.getElementById('sw-next').addEventListener('click', function () { cycle(1); });

document.addEventListener('keydown', function (e) {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
});

document.addEventListener('click', function (e) {
  if (!e.target.closest('[data-search]')) closeAllDrops();
});

render();
  </script>
</body>
</html>
