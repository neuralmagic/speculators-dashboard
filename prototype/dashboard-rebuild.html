<!-- PROTOTYPE: throwaway design exploration for issue #140. Question: what should the rebuilt dashboard look and feel like?
     Update, pass 5 (converged): the original site with surgical changes. No stats band, no target tabs or algorithm filter (search only), failed models hidden, no Analysis section, no benchmark-suite comparison, no variant switcher. The Benchmarks table expands on row click to an inline per-subset bar chart with a local Acceptance/Throughput/Latency selector, plus a SPEED-Bench subsection that renders only when speed-bench results exist for that model (none in current data). Data is real, trimmed from results.json (14 ok models with per-subset metrics; sweep arrays, acceptance_at_pos, baselines, and speedup dropped). Version provenance (vLLM and speculators versions) is not recorded in results.json; it arrives with the new eval-folder contract, so version badges render only when those fields exist.
     Update, pass 6 (manager feedback): algorithm filter buttons above the table (All plus one per algorithm). The table lists the full RedHatAI/speculator-models collection (35 models, snapshot fetched 2026-09-24 from the HF API), merged with the trimmed results.json evals by model id. Models without a successful eval, including the 3 failed runs, render as not evaluated and link to their HF model card. Default order is HF upload date, newest first. -->
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Speculators | Find the fastest drafter</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
  --radius-shell: 1.25rem;
  --radius-base: 0.625rem;
  --max-w: 72rem;
  --yellow: #fdb517;
  --yellow-hover: #e5a315;
  --red: #ef4444;
  --green: #22c55e;
  --eagle3: #3b82f6;
  --dflash: #f97316;
  --peagle: #a855f7;
  --mtp: #10b981;
  --dspark: #eab308;
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #020617;
  --surface: #0f172a;
  --muted-surface: #1e293b;
  --text-1: #f8fafc;
  --text-2: #94a3b8;
  --text-3: #64748b;
  --border: rgba(255,255,255,0.1);
  --border-input: rgba(255,255,255,0.15);
  --border-soft: rgba(255,255,255,0.05);
  --row-hover: rgba(255,255,255,0.025);
  --inset-bg: rgba(2,6,23,0.45);
  --shell-bg: rgba(15,23,42,0.55);
  --eyebrow-bg: rgba(2,6,23,0.4);
  --blue: #30a2ff;
  --aur-deep: rgba(6,21,46,0.95);
  --aur-blue: rgba(11,79,143,0.55);
  --aur-bright: rgba(48,162,255,0.28);
  --aur-gold: rgba(253,181,23,0.10);
  --algo-eagle3-text: #60a5fa;
  --algo-dflash-text: #fb923c;
  --algo-peagle-text: #c084fc;
  --algo-mtp-text: #34d399;
  --dia-node-fill: rgba(15,23,42,0.85);
}
html[data-theme="light"] {
  color-scheme: light;
  --bg: #f6f8fb;
  --surface: #ffffff;
  --muted-surface: #e8edf4;
  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #8a9ab0;
  --border: rgba(15,23,42,0.12);
  --border-input: rgba(15,23,42,0.2);
  --border-soft: rgba(15,23,42,0.07);
  --row-hover: rgba(15,23,42,0.03);
  --inset-bg: rgba(241,245,249,0.85);
  --shell-bg: rgba(255,255,255,0.8);
  --eyebrow-bg: rgba(255,255,255,0.65);
  --blue: #0284c7;
  --aur-deep: rgba(186,215,245,0.55);
  --aur-blue: rgba(125,180,235,0.4);
  --aur-bright: rgba(48,162,255,0.16);
  --aur-gold: rgba(253,181,23,0.14);
  --algo-eagle3-text: #2563eb;
  --algo-dflash-text: #ea580c;
  --algo-peagle-text: #9333ea;
  --algo-mtp-text: #059669;
  --dia-node-fill: rgba(255,255,255,0.92);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text-1);
  line-height: 1.6;
  overflow-x: hidden;
  transition: background 0.25s ease, color 0.25s ease;
}
::selection { background: rgba(48,162,255,0.35); }
a { color: var(--blue); text-decoration: none; }
button { font-family: var(--sans); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }

.fade-in-up {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
}
.fade-in-up.visible { opacity: 1; transform: translateY(0); }

.container { max-width: var(--max-w); margin: 0 auto; padding: 0 2rem; }

.site-nav {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  max-width: 80rem;
  margin: 0 auto;
  padding: 1.5rem 2rem;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  color: var(--text-1);
  font-weight: 700;
  font-size: 1.0625rem;
  letter-spacing: -0.01em;
}
.nav-brand:hover { text-decoration: none; }
.nav-brand svg { height: 1.75rem; width: auto; display: block; }
.nav-brand .nav-sub { font-weight: 400; color: var(--text-2); }
.nav-links { display: flex; align-items: center; gap: 1.75rem; }
.nav-links a {
  color: var(--text-2);
  font-size: 0.875rem;
  font-weight: 500;
  transition: color 250ms ease;
}
.nav-links a:hover { color: var(--text-1); text-decoration: none; }
.theme-toggle {
  font-family: var(--mono);
  font-size: 0.6875rem;
  padding: 0.3rem 0.7rem;
  border: 1px solid var(--border-input);
  border-radius: 999px;
  color: var(--text-2);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 250ms ease, border-color 250ms ease;
}
.theme-toggle:hover { color: var(--text-1); border-color: var(--text-3); }

.hero {
  position: relative;
  overflow: hidden;
  min-height: 88vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 9rem 2rem 7rem;
  background: var(--bg);
}
.aurora { position: absolute; inset: -10%; pointer-events: none; }
.aurora-blob { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform; }
.aurora-blob--deep {
  top: -20%; left: -10%; width: 65vw; height: 65vw;
  background: radial-gradient(circle, var(--aur-deep) 0%, transparent 65%);
  animation: drift-a 28s ease-in-out infinite;
}
.aurora-blob--blue {
  top: 5%; right: -15%; width: 55vw; height: 55vw;
  background: radial-gradient(circle, var(--aur-blue) 0%, transparent 62%);
  animation: drift-b 24s ease-in-out infinite;
}
.aurora-blob--bright {
  bottom: -25%; left: 20%; width: 50vw; height: 50vw;
  background: radial-gradient(circle, var(--aur-bright) 0%, transparent 60%);
  animation: drift-c 30s ease-in-out infinite;
}
.aurora-blob--gold {
  top: 35%; left: 55%; width: 30vw; height: 30vw;
  background: radial-gradient(circle, var(--aur-gold) 0%, transparent 60%);
  animation: drift-b 26s ease-in-out infinite reverse;
}
.aurora::after {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(circle, rgba(255,255,255,0.025) 1px, transparent 1px);
  background-size: 26px 26px;
}
.hero::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 30%;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}
@keyframes drift-a {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33%      { transform: translate(7%, -6%) scale(1.12); }
  66%      { transform: translate(-5%, 5%) scale(0.96); }
}
@keyframes drift-b {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-8%, 7%) scale(1.1); }
}
@keyframes drift-c {
  0%, 100% { transform: translate(0, 0) scale(1); }
  40%      { transform: translate(6%, -9%) scale(1.08); }
  75%      { transform: translate(-6%, -3%) scale(0.94); }
}
.hero-content {
  position: relative;
  z-index: 1;
  max-width: 60rem;
  width: 100%;
  text-align: center;
  animation: hero-in 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
}
@keyframes hero-in {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.625rem;
  padding: 0.375rem 1rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 2.25rem;
  background: var(--eyebrow-bg);
}
.hero-eyebrow .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--blue);
  box-shadow: 0 0 10px rgba(48,162,255,0.9);
}
.hero-title {
  font-size: clamp(3.5rem, 7.5vw, 5.5rem);
  font-weight: 800;
  letter-spacing: -0.035em;
  line-height: 1.04;
  color: var(--text-1);
  margin-bottom: 1.75rem;
}
.hero-title .grad {
  background: linear-gradient(94deg, #30a2ff 5%, #7cc7ff 42%, #fdb517 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero-subtitle {
  font-size: 1.25rem;
  font-weight: 400;
  color: var(--text-2);
  max-width: 38rem;
  margin: 0 auto 2.75rem;
  line-height: 1.65;
}
.hero-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; margin-bottom: 2rem; }
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.875rem 2rem;
  border-radius: 999px;
  font-size: 0.9375rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 250ms ease;
  text-decoration: none;
}
.btn-primary { background: var(--yellow); color: #020617; }
.btn-primary:hover { background: var(--yellow-hover); transform: translateY(-2px); text-decoration: none; }
.btn-ghost { background: transparent; color: var(--text-1); border: 1px solid var(--border-input); }
.btn-ghost:hover { border-color: var(--text-3); background: var(--row-hover); transform: translateY(-2px); text-decoration: none; }
.hero-meta { font-size: 0.8125rem; color: var(--text-3); font-family: var(--mono); }

.how-section { padding: 2rem 0 0; }
.how-shell {
  background: var(--shell-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-shell);
  padding: 2.75rem 2.5rem 2rem;
}
.how-header { text-align: center; max-width: 44rem; margin: 0 auto 2.25rem; }
.how-eyebrow {
  font-family: var(--mono);
  font-size: 0.75rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 0.875rem;
}
.how-title {
  font-size: 1.875rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-1);
  margin-bottom: 0.875rem;
}
.how-caption { font-size: 1rem; color: var(--text-2); line-height: 1.65; }

.spec-diagram { width: 100%; height: auto; display: block; }
.spec-diagram text { font-family: var(--mono); text-transform: uppercase; }
.dia-label { fill: var(--text-2); font-size: 9.5px; letter-spacing: 0.14em; }
.dia-sub   { fill: var(--text-3); font-size: 8px; letter-spacing: 0.12em; }
.dia-anno  { fill: var(--text-3); font-size: 8px; letter-spacing: 0.16em; }
.dia-node  { fill: var(--dia-node-fill); stroke: rgba(48,162,255,0.55); stroke-width: 1; }
.dia-node--target { stroke: var(--blue); stroke-width: 1.25; }
.dia-edge  { stroke: rgba(48,162,255,0.35); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
.dia-edge--accept { stroke: rgba(34,197,94,0.45); }
.dia-leader { stroke: rgba(148,163,184,0.3); stroke-width: 1; stroke-dasharray: 2 3; }
.dia-pulse {
  fill: none; stroke: var(--blue); stroke-width: 1.5; opacity: 0;
  transform-origin: 496px 96px;
  animation: verify-pulse 6s ease-out infinite;
}
@keyframes verify-pulse {
  0%, 38%   { opacity: 0; transform: scale(1); }
  44%       { opacity: 0.7; transform: scale(1); }
  62%, 100% { opacity: 0; transform: scale(1.35); }
}
.chip rect { rx: 3; stroke-width: 1; fill: rgba(48,162,255,0.14); stroke: var(--blue); }
.chip text { fill: var(--blue); font-size: 9px; font-weight: 700; }
.chip { animation: chip-fly 6s linear infinite; opacity: 0; }
.chip rect { animation: chip-ok-rect 6s linear infinite; }
.chip text { animation: chip-ok-text 6s linear infinite; }
.chip-2 rect, .chip-2 text, .chip-2 { animation-delay: 0.12s; }
.chip-3 rect, .chip-3 text, .chip-3 { animation-delay: 0.24s; }
.chip-4 rect, .chip-4 text, .chip-4 { animation-delay: 0.36s; }
@keyframes chip-fly {
  0%        { transform: translate(0, 0);     opacity: 0; }
  6%        { opacity: 1; }
  52%       { transform: translate(236px, 0); opacity: 1; }
  56%, 100% { transform: translate(236px, 0); opacity: 1; }
}
.chip-1 rect, .chip-2 rect { animation-name: chip-ok-rect; }
.chip-1 text, .chip-2 text { animation-name: chip-ok-text; }
.chip-1, .chip-2 { animation-name: chip-fly; }
.chip-3, .chip-4 { animation-name: chip-fly-reject; }
@keyframes chip-ok-rect {
  0%, 51%   { fill: rgba(48,162,255,0.14); stroke: var(--blue); }
  56%, 100% { fill: rgba(34,197,94,0.16); stroke: var(--green); }
}
@keyframes chip-ok-text {
  0%, 51%   { fill: var(--blue); }
  56%, 100% { fill: var(--green); }
}
@keyframes chip-fly-reject {
  0%        { transform: translate(0, 0);        opacity: 0; }
  6%        { opacity: 1; }
  52%       { transform: translate(236px, 0);    opacity: 1; }
  56%       { transform: translate(236px, 0);    opacity: 1; }
  74%       { transform: translate(236px, 26px); opacity: 0.85; }
  88%, 100% { transform: translate(236px, 26px); opacity: 0; }
}
.chip-3 rect, .chip-4 rect { animation-name: chip-rej-rect; }
.chip-3 text, .chip-4 text { animation-name: chip-rej-text; }
@keyframes chip-rej-rect {
  0%, 51%   { fill: rgba(48,162,255,0.14); stroke: var(--blue); }
  56%, 100% { fill: rgba(239,68,68,0.12); stroke: var(--red); }
}
@keyframes chip-rej-text {
  0%, 51%   { fill: var(--blue); }
  56%, 100% { fill: var(--red); }
}
.out-token rect { fill: rgba(34,197,94,0.14); stroke: var(--green); rx: 3; }
.out-token text { fill: var(--green); font-size: 9px; font-weight: 700; }
.out-token { animation: out-token 6s linear infinite; opacity: 0; }
.out-token-2 { animation-delay: 0.18s; }
@keyframes out-token {
  0%, 54%   { transform: translate(0, 0);    opacity: 0; }
  60%       { opacity: 1; }
  86%       { transform: translate(56px, 0); opacity: 1; }
  94%, 100% { transform: translate(56px, 0); opacity: 0; }
}
.dia-loop-dot { fill: var(--blue); opacity: 0; animation: loop-dot 6s ease-in-out infinite; }
@keyframes loop-dot {
  0%, 62%   { opacity: 0; transform: translateX(0); }
  68%       { opacity: 0.9; }
  88%       { opacity: 0.9; transform: translateX(-212px); }
  94%, 100% { opacity: 0; transform: translateX(-212px); }
}

.section-head { margin-bottom: 2.5rem; }
.section-eyebrow {
  font-family: var(--mono);
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 0.875rem;
}
.section-title {
  font-size: clamp(2rem, 4vw, 2.875rem);
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.1;
  color: var(--text-1);
}
.section-desc { font-size: 1rem; color: var(--text-2); margin-top: 0.875rem; max-width: 40rem; }

.benchmark-section { padding: 2rem 0 4rem; }
.target-tabs {
  display: flex;
  gap: 0.25rem;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  margin-bottom: 1.5rem;
}
.target-tab {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.75rem 1.125rem;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  color: var(--text-3);
  font-size: 0.875rem;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: color 250ms ease, border-color 250ms ease;
}
.target-tab:hover { color: var(--text-1); }
.target-tab.active { color: var(--text-1); border-bottom-color: var(--blue); }
.tab-count {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 1.25rem;
  height: 1.25rem;
  padding: 0 0.375rem;
  border-radius: 999px;
  background: var(--muted-surface);
  font-family: var(--mono);
  font-size: 0.6875rem;
  font-weight: 500;
  color: var(--text-3);
}
.target-tab.active .tab-count { background: rgba(48,162,255,0.15); color: var(--blue); }

.filters { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
.filter-select, .filter-input {
  background: var(--surface);
  border: 1px solid var(--border-input);
  border-radius: var(--radius-base);
  color: var(--text-1);
  font-family: var(--sans);
  font-size: 0.875rem;
  padding: 0.625rem 1rem;
  outline: none;
  transition: border-color 250ms ease, box-shadow 250ms ease;
}
.filter-select { min-width: 180px; cursor: pointer; }
.filter-input { flex: 1; min-width: 220px; }
.filter-input::placeholder { color: var(--text-3); }
.filter-select:hover, .filter-input:hover { border-color: var(--text-3); }
.filter-select:focus, .filter-input:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(48,162,255,0.15);
}
.filter-select option { background: var(--surface); color: var(--text-1); }

.table-shell {
  border: 1px solid var(--border);
  border-radius: var(--radius-shell);
  background: var(--surface);
  overflow: hidden;
}
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
thead th {
  text-align: left;
  padding: 1rem 1.25rem;
  font-size: 0.6875rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-3);
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
  transition: color 250ms ease;
}
thead th:hover { color: var(--text-1); }
thead th .sort-arrow { font-size: 0.625rem; margin-left: 0.375rem; color: var(--blue); }
th.right, td.right { text-align: right; }
tbody tr { transition: background 250ms ease; }
tbody tr.model-row:hover { background: var(--row-hover); }
td { padding: 0.875rem 1.25rem; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
.model-name { display: flex; flex-direction: column; gap: 0.25rem; }
.model-name .top-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
.model-name a.d-name {
  font-weight: 600;
  font-size: 0.9375rem;
  color: var(--text-1);
  font-family: var(--mono);
  transition: color 250ms ease;
}
.model-name a.d-name:hover { color: var(--blue); text-decoration: none; }
.model-target { font-size: 0.75rem; color: var(--text-3); }
.placeholder { text-align: center; color: var(--text-3); padding: 4rem 2rem; font-size: 0.9375rem; }

tbody tr.model-row.expanded { background: var(--row-active); }
tr.detail-row > td { padding: 0; }
tr.detail-row > td:hover { background: transparent; }
.detail-inner { padding: 1.25rem 1.5rem 1.5rem; background: var(--inset-bg); }
.expand-sb { margin-top: 1.5rem; }
.expand-sb .section-eyebrow { margin-bottom: 0.75rem; }

.algo-badge {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 999px;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.algo-eagle3 { background: rgba(59,130,246,0.15);  color: var(--algo-eagle3-text); }
.algo-dflash { background: rgba(249,115,22,0.15);  color: var(--algo-dflash-text); }
.algo-peagle { background: rgba(168,85,247,0.15);  color: var(--algo-peagle-text); }
.algo-mtp    { background: rgba(16,185,129,0.15);  color: var(--algo-mtp-text); }
.algo-other  { background: rgba(148,163,184,0.15); color: var(--text-2); }
.algo-dspark { background: rgba(234,179,8,0.15); color: #facc15; }
html[data-theme="light"] .algo-dspark { color: #a16207; }

.pend-badge {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 999px;
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;

  return i >= 0 ? s.slice(0, i) : s.slice(0, s.lastIndexOf('.'));
}

function algoClass(algo) {
  const map = { eagle3: 'algo-eagle3', dflash: 'algo-dflash', dflash2: 'algo-dflash', peagle: 'algo-peagle', mtp: 'algo-mtp', dspark: 'algo-dspark' };
  return map[algo] || 'algo-other';
}

function formatHardware(gpus) {
  if (!gpus) return 'unknown';
  const match = gpus.match(/^(\d+)x(.+)$/i);
  return match ? match[1] + 'x ' + match[2].toUpperCase() : gpus;
}

function fmtUpdated(iso) {
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
}

function versionChips(m) {
  let html = '';
  if (m.vllm) html += ' <span class="hw-chip">vLLM ' + m.vllm + '</span>';
  if (m.speculators) html += ' <span class="hw-chip">speculators ' + m.speculators + '</span>';
  return html;
}

function algoColor(algo) {
  return ALGO_COLORS[algo] || 'var(--text-3)';
}

function navHTML() {
  return '<nav class="site-nav">' +
    '<a class="nav-brand" href="https://github.com/vllm-project/speculators" target="_blank" rel="noopener">' +
    LOGO_SVG + 'vLLM <span class="nav-sub">/ Speculators</span></a>' +
    '<div class="nav-links">' +
    '<a href="https://huggingface.co/collections/RedHatAI/speculator-models" target="_blank" rel="noopener">Models</a>' +
    '<a href="https://github.com/vllm-project/speculators" target="_blank" rel="noopener">GitHub</a>' +
    '<button type="button" class="theme-toggle" data-theme-toggle>Theme: ' + (state.theme === 'dark' ? 'Dark' : 'Light') + '</button>' +
    '</div></nav>';
}

function heroHTML() {
  return '<header class="hero">' +
    '<div class="aurora" aria-hidden="true">' +
    '<div class="aurora-blob aurora-blob--deep"></div>' +
    '<div class="aurora-blob aurora-blob--blue"></div>' +
    '<div class="aurora-blob aurora-blob--bright"></div>' +
    '<div class="aurora-blob aurora-blob--gold"></div></div>' +
    navHTML() +
    '<div class="hero-content">' +
    '<div class="hero-eyebrow"><span class="dot"></span>Speculative Decoding Evals</div>' +
    '<h1 class="hero-title">Find the <span class="grad">fastest drafter</span><br>for your model.</h1>' +
    '<p class="hero-subtitle">Every speculator in the RedHatAI speculator-models collection, benchmarked against real workloads. Acceptance length, throughput, and latency: measured, compared, and ready to deploy.</p>' +
    '<div class="hero-links">' +
    '<a href="https://huggingface.co/collections/RedHatAI/speculator-models" target="_blank" rel="noopener" class="btn btn-primary">Browse Models</a>' +
    '<a href="https://github.com/vllm-project/speculators" target="_blank" rel="noopener" class="btn btn-ghost">View on GitHub</a>' +
    '</div>' +
    '<div class="hero-meta">Last updated: ' + fmtUpdated(UPDATED_AT) + '</div>' +
    '</div></header>';
}

  return '<section class="how-section fade-in-up"><div class="container"><div class="how-shell">' +
    '<div class="how-header">' +

    '</div>' +
    `<svg class="spec-diagram" viewBox="0 0 640 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Diagram of speculative decoding: a drafter model proposes tokens, the target model verifies them, accepted tokens are kept, and the first rejected token plus all tokens after it are discarded.">

      <path class="dia-edge dia-edge--accept" d="M 560 96 H 600" />
      <path class="dia-edge" d="M 496 148 C 496 196, 148 196, 148 148" />
      <g>
        <rect class="dia-node" x="64" y="64" width="112" height="64" rx="6" />
        <text class="dia-label" x="120" y="92" text-anchor="middle">Drafter</text>

      </g>
      <g>
        <rect class="dia-node dia-node--target" x="404" y="52" width="184" height="88" rx="6" />
        <text class="dia-label" x="496" y="90" text-anchor="middle">Target Model</text>
        <text class="dia-sub" x="496" y="106" text-anchor="middle">PARALLEL VERIFY · γ=4</text>
        <circle class="dia-pulse" cx="496" cy="96" r="58" />
      </g>
      <g class="chip chip-1 chip-static"><rect x="182" y="82" width="28" height="28" /><text x="196" y="99" text-anchor="middle">t₁</text></g>
      <g class="chip chip-2 chip-static"><rect x="214" y="82" width="28" height="28" /><text x="228" y="99" text-anchor="middle">t₂</text></g>
      <g class="chip chip-3 chip-static"><rect x="246" y="82" width="28" height="28" /><text x="260" y="99" text-anchor="middle">t₃</text></g>
      <g class="chip chip-4 chip-static"><rect x="278" y="82" width="28" height="28" /><text x="292" y="99" text-anchor="middle">t₄</text></g>
      <g class="out-token out-token-1"><rect x="566" y="82" width="28" height="28" /><text x="580" y="99" text-anchor="middle">t₁</text></g>
      <g class="out-token out-token-2"><rect x="566" y="82" width="28" height="28" /><text x="580" y="99" text-anchor="middle">t₂</text></g>
      <circle class="dia-loop-dot" cx="496" cy="172" r="3" />
      <path class="dia-leader" d="M 260 74 V 40 H 244" />
      <text class="dia-anno" x="238" y="44" text-anchor="end">γ draft tokens</text>
      <path class="dia-leader" d="M 496 22 V 46" />
      <text class="dia-anno" x="496" y="14" text-anchor="middle">1 forward pass</text>
      <path class="dia-leader" d="M 322 176 H 392 V 150" />
      <text class="dia-anno" x="314" y="180" text-anchor="end">re-draft</text>
    </svg>` +
    '</div></div></section>';
}

function footerHTML() {
  return '<footer class="site-footer">' +
    '<span>Data source: <code>results.json</code> &middot; &copy; 2025 Red Hat AI</span>' +
    '<span>Powered by <a href="https://github.com/vllm-project/speculators" target="_blank" rel="noopener">vllm-project/speculators</a></span>' +
    '</footer>';
}

const SORTS = {
  model: function (d) { return d.model.toLowerCase(); },
  acceptance: function (d) { return d.metrics ? d.metrics.acceptance_length : null; },
  throughput: function (d) { return d.metrics ? d.metrics.throughput_tps : null; },
  ttft: function (d) { return d.metrics ? d.metrics.ttft_ms : null; },
  itl: function (d) { return d.metrics ? d.metrics.itl_ms : null; },
  hardware: function (d) { return d.gpus || ''; },
  uploaded: function (d) { return d.lastModified; }
};

function filteredData() {
  const q = state.filters.text.trim().toLowerCase();
  const out = MODELS.filter(function (d) {
    if (state.filters.algo !== 'all' && d.algorithm !== state.filters.algo) return false;
    if (q) {
      const hay = (d.model + ' ' + (d.target || '') + ' ' + d.algorithm).toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  const f = SORTS[state.sort.key];
  out.sort(function (a, b) {
    if (state.sort.key === 'uploaded') {
      const ea = a.evaluated ? 0 : 1;
      const eb = b.evaluated ? 0 : 1;
      if (ea !== eb) return ea - eb;
      return (a.lastModified < b.lastModified ? -1 : a.lastModified > b.lastModified ? 1 : 0) * state.sort.dir;
    }
    const x = f(a), y = f(b);
    if (x === null && y === null) return 0;
    if (x === null) return 1;
    if (y === null) return -1;
    return (x < y ? -1 : x > y ? 1 : 0) * state.sort.dir;
  });
  return out;
}

function tableHTML() {
  const rows = filteredData();
  const cols = [
    ['model', 'Drafter', ''], ['acceptance', 'Accept. Len', 'right'],
    ['throughput', 'Throughput', 'right'], ['ttft', 'TTFT', 'right'],
    ['itl', 'ITL', 'right'], ['hardware', 'Hardware', ''], ['uploaded', 'Uploaded', '']
  ];
  const head = cols.map(function (c) {
    const arrow = state.sort.key === c[0] ? '<span class="sort-arrow">' + (state.sort.dir === 1 ? '▲' : '▼') + '</span>' : '';
    return '<th class="' + c[2] + '" data-sort="' + c[0] + '">' + c[1] + arrow + '</th>';
  }).join('');
  if (rows.length === 0) {
    return '<div class="table-shell"><table><thead><tr>' + head + '</tr></thead></table>' +
      '<div class="placeholder">No models match the current filters.</div></div>';
  }
  const body = rows.map(function (d) {
    const nameCell = '<td><div class="model-name"><span class="top-row">' +
      '<a class="d-name" href="https://huggingface.co/' + d.model + '" target="_blank" rel="noopener noreferrer">' + short(d.model) + '</a>' +
      '<span class="algo-badge ' + algoClass(d.algorithm) + '">' + d.algorithm + '</span>' +
      (d.evaluated ? '' : '<span class="pend-badge">not evaluated</span>') + '</span>' +
      '<span class="model-target">' + (d.target ? short(d.target) : baseName(d.model)) + '</span></div></td>';
    const uploadedCell = '<td><span class="hw-chip">' + d.lastModified.slice(0, 10) + '</span></td>';
    if (!d.evaluated) {
      return '<tr class="model-row" data-href="https://huggingface.co/' + d.model + '">' +
        nameCell +
        '<td class="right"></td><td class="right"></td><td class="right"></td><td class="right"></td>' +
        '<td></td>' + uploadedCell + '</tr>';
    }
    let html = '<tr class="model-row' + (state.expanded === d.model ? ' expanded' : '') + '" data-expand="' + d.model + '">' +
      nameCell +
      '<td class="right"><span class="metric-val">' + d.metrics.acceptance_length.toFixed(2) + '</span></td>' +
      '<td class="right"><span class="metric-val">' + METRICS.throughput.fmt(d.metrics.throughput_tps) + '</span><span class="metric-unit">tok/s</span></td>' +
      '<td class="right"><span class="metric-val">' + d.metrics.ttft_ms.toFixed(1) + '</span><span class="metric-unit">ms</span></td>' +
      '<td class="right"><span class="metric-val">' + d.metrics.itl_ms.toFixed(2) + '</span><span class="metric-unit">ms/tok</span></td>' +
      '<td><span class="hw-chip">' + formatHardware(d.gpus) + '</span> <span class="hw-chip">' + d.evaluated_at.slice(0, 10) + '</span>' + versionChips(d) + '</td>' +
      uploadedCell + '</tr>';
    if (state.expanded === d.model) html += expandHTML(d);
    return html;
  }).join('');
  return '<div class="table-shell"><div class="table-scroll"><table>' +
    '<thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div></div>';
}

function expandHTML(d) {
  const m = METRICS[state.metric];
  const subsets = Object.keys(d.subsets);
  let max = 0;
  subsets.forEach(function (s) {
    const v = d.subsets[s][m.field];
    if (v !== null && v !== undefined && v > max) max = v;
  });
  const tabs = '<div class="target-tabs metric-tabs">' + Object.keys(METRICS).map(function (k) {
    return '<button type="button" class="target-tab' + (state.metric === k ? ' active' : '') + '" data-metric="' + k + '">' + METRICS[k].label + '</button>';
  }).join('') + '</div>';
  const bars = subsets.map(function (s) {
    const v = d.subsets[s][m.field];
    const missing = v === null || v === undefined;
    const h = missing ? 0 : Math.max(3, Math.round((v / max) * 100));
    return '<div class="ggroup"><div class="ggroup-bars"><div class="gbar-wrap">' +
      '<span class="gbar-val">' + (missing ? 'n/a' : m.fmt(v)) + '</span>' +
      '<div class="gbar" style="height:' + h + '%;background:' + algoColor(d.algorithm) + '" title="' + s + ': ' + (missing ? 'n/a' : m.fmt(v) + ' ' + m.unit) + '"></div></div></div>' +
      '<div class="ggroup-label">' + s + '</div></div>';
  }).join('');
  let sb = '';
  if (d.speedBench && d.speedBench.length) {
    const sbRows = d.speedBench.map(function (s) {
      return '<tr><td>' + s.subset + '</td><td class="right"><span class="metric-val">' + s.score.toFixed(1) + '</span></td></tr>';
    }).join('');
    sb = '<div class="expand-sb"><div class="section-eyebrow">SPEED-Bench</div>' +
      '<div class="table-shell"><table><thead><tr><th>Subset</th><th class="right">Score</th></tr></thead>' +
      '<tbody>' + sbRows + '</tbody></table></div></div>';
  }
  return '<tr class="detail-row"><td colspan="7"><div class="detail-inner">' +
    tabs + '<div class="gchart-groups">' + bars + '</div>' + sb +
    '</div></td></tr>';
}

function algoTabsHTML() {
  const counts = {};
  MODELS.forEach(function (d) { counts[d.algorithm] = (counts[d.algorithm] || 0) + 1; });
  const algos = Object.keys(counts).sort();
  let html = '<button type="button" class="target-tab' + (state.filters.algo === 'all' ? ' active' : '') + '" data-algo="all">All <span class="tab-count">' + MODELS.length + '</span></button>';
  algos.forEach(function (a) {
    html += '<button type="button" class="target-tab' + (state.filters.algo === a ? ' active' : '') + '" data-algo="' + a + '">' + a + ' <span class="tab-count">' + counts[a] + '</span></button>';
  });
  return '<div class="target-tabs">' + html + '</div>';
}

function benchmarksHTML() {
  return '<section class="benchmark-section fade-in-up"><div class="container">' +
    '<div class="section-head">' +
    '<div class="section-eyebrow">Benchmarks</div>' +
    '<h2 class="section-title">The results.</h2>' +
    '<p class="section-desc">Click an evaluated drafter row for per-subset results.</p></div>' +
    '<div id="algo-wrap">' + algoTabsHTML() + '</div>' +
    '<div class="filters">' +
    '<input type="search" class="filter-input" id="filter-text" placeholder="Search models..." aria-label="Search models" value="' + state.filters.text + '">' +
    '</div>' +
    '<div id="table-wrap">' + tableHTML() + '</div>' +
    '</div></section>';
}

function pageHTML() {
  return heroHTML() +
    '<main>' +
    howHTML() +
    benchmarksHTML() +
    '</main>' + footerHTML();
}

function refreshTable() {
  document.getElementById('algo-wrap').innerHTML = algoTabsHTML();
  document.getElementById('table-wrap').innerHTML = tableHTML();
  bindTableControls();
}

function bindTableControls() {
  document.querySelectorAll('#algo-wrap [data-algo]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.filters.algo = b.dataset.algo;
      refreshTable();
    });
  });
  document.querySelectorAll('#table-wrap [data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      const key = th.dataset.sort;
      if (state.sort.key === key) { state.sort.dir = -state.sort.dir; }
      else { state.sort.key = key; state.sort.dir = key === 'model' || key === 'hardware' ? 1 : -1; }
      refreshTable();
    });
  });
  document.querySelectorAll('#table-wrap [data-expand]').forEach(function (tr) {
    tr.addEventListener('click', function () {
      state.expanded = state.expanded === tr.dataset.expand ? null : tr.dataset.expand;
      refreshTable();
    });
  });
  document.querySelectorAll('#table-wrap [data-href]').forEach(function (tr) {
    tr.addEventListener('click', function () { window.open(tr.dataset.href, '_blank'); });
  });
  document.querySelectorAll('#table-wrap [data-metric]').forEach(function (b) {
    b.addEventListener('click', function (e) {
      e.stopPropagation();
      state.metric = b.dataset.metric;
      refreshTable();
    });
  });
  document.querySelectorAll('#table-wrap .d-name').forEach(function (a) {
    a.addEventListener('click', function (e) { e.stopPropagation(); });
  });
}

function bind() {
  document.querySelectorAll('[data-theme-toggle]').forEach(function (b) {
    b.addEventListener('click', function () {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      render();
    });
  });
  const textInput = document.getElementById('filter-text');
  if (textInput) {
    textInput.addEventListener('input', function () {
      state.filters.text = textInput.value;
      refreshTable();
    });
  }
  bindTableControls();
}

function setupAnimations() {
  const observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('visible');
    });
  }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
  document.querySelectorAll('.fade-in-up').forEach(function (el) { observer.observe(el); });
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('app').innerHTML = pageHTML();
  bind();
  setupAnimations();
}

render();
  </script>
</body>
